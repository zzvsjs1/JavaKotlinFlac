name: Windows Build

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  build:
    name: Build and test on Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        shell: pwsh
        run: .\gradlew.bat build --no-daemon --stacktrace

      - name: Publish to Maven local
        shell: pwsh
        run: .\gradlew.bat publishToMavenLocal --no-daemon --stacktrace

      - name: Smoke test Maven local consumer
        shell: pwsh
        run: .\gradlew.bat consumerSmokeTest --no-daemon --stacktrace
