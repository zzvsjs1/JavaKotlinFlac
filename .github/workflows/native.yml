name: Cross-platform native build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  native:
    name: Build and test ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            runner: windows-2025
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-aarch64
            runner: macos-15

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Gradle builds flac and metaflac from the checksum-pinned FLAC 1.5.0
      # source tree so runner package versions cannot weaken 32-bit coverage.
      - name: Install and verify FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install ffmpeg --yes --no-progress

          $ffmpegPath = (Get-Command ffmpeg -CommandType Application -ErrorAction Stop).Source

          & $ffmpegPath -version
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg -version failed with exit code $LASTEXITCODE" }

          "JFLAC_EXTERNAL_FFMPEG=$ffmpegPath" >> $env:GITHUB_ENV

      - name: Install and verify FFmpeg on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes ffmpeg

          ffmpeg_path="$(command -v ffmpeg)"

          test -x "$ffmpeg_path"

          "$ffmpeg_path" -version

          echo "JFLAC_EXTERNAL_FFMPEG=$ffmpeg_path" >> "$GITHUB_ENV"

      - name: Install and verify FFmpeg on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          brew install ffmpeg

          ffmpeg_path="$(command -v ffmpeg)"

          test -x "$ffmpeg_path"

          "$ffmpeg_path" -version

          echo "JFLAC_EXTERNAL_FFMPEG=$ffmpeg_path" >> "$GITHUB_ENV"

      - name: Build, test, verify external interoperability, and run the host consumer smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat build externalInteropTest publishToMavenLocal consumerSmokeTest --no-daemon --stacktrace

      - name: Build, test, verify external interoperability, and run the host consumer smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./gradlew build externalInteropTest publishToMavenLocal consumerSmokeTest --no-daemon --stacktrace

      - name: Run long-file memory and seek performance checks
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./gradlew longFilePerformanceTest --no-daemon --stacktrace

      - name: Upload the host native bundle
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: build/generated-resources/main/META-INF/native
          if-no-files-found: error
          retention-days: 7

  native-sanitizer:
    name: Native ASan, UBSan, and fuzz smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install and verify Clang sanitizer runtimes
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes clang libclang-rt-dev

          clang --version
          test -f "$(clang -print-file-name=libclang_rt.asan-x86_64.so)"
          test -f "$(clang -print-file-name=libclang_rt.fuzzer-x86_64.a)"

      - name: Run sanitizer-instrumented JNI tests and bounded fuzz smoke budgets
        shell: bash
        run: bash ./gradlew nativeSanitizerSmoke --no-daemon --stacktrace

      - name: Upload fuzz crash artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-fuzz-crash-artefacts
          path: build/native-fuzz-artifacts
          if-no-files-found: ignore
          retention-days: 14

  universal:
    name: Assemble and verify the universal JAR
    needs: native
    runs-on: ubuntu-22.04

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download all native bundles
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: build/ci-native-bundles/META-INF/native
          merge-multiple: true

      - name: Build and verify one cross-platform artefact
        shell: bash
        run: >-
          bash ./gradlew build --no-daemon --stacktrace
          -Pjflac.nativeBundleDirectory=build/ci-native-bundles

      - name: Upload universal consumer artefacts
        uses: actions/upload-artifact@v4
        with:
          name: universal-jars
          path: |
            build/libs/jflac-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
            jflac-java-sound/build/libs/jflac-java-sound-*.jar
            !jflac-java-sound/build/libs/*-sources.jar
            !jflac-java-sound/build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 7

  universal-smoke:
    name: Test the universal JAR on ${{ matrix.target }}
    needs: universal
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            runner: windows-2025
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-aarch64
            runner: macos-15

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download the universal JARs
        uses: actions/download-artifact@v4
        with:
          name: universal-jars
          path: .

      - name: Run the universal consumer smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          .\gradlew.bat -p consumer-smoke-test run --no-daemon --stacktrace
          "-PjflacJar=$env:GITHUB_WORKSPACE\build\libs\jflac-0.1.0-SNAPSHOT.jar"
          "-PjflacJavaSoundJar=$env:GITHUB_WORKSPACE\jflac-java-sound\build\libs\jflac-java-sound-0.1.0-SNAPSHOT.jar"
          "-PjflacSamplePath=$env:GITHUB_WORKSPACE\build\consumer-smoke\universal.flac"

      - name: Run the universal consumer smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          bash ./gradlew -p consumer-smoke-test run --no-daemon --stacktrace
          "-PjflacJar=$GITHUB_WORKSPACE/build/libs/jflac-0.1.0-SNAPSHOT.jar"
          "-PjflacJavaSoundJar=$GITHUB_WORKSPACE/jflac-java-sound/build/libs/jflac-java-sound-0.1.0-SNAPSHOT.jar"
          "-PjflacSamplePath=$GITHUB_WORKSPACE/build/consumer-smoke/universal.flac"
